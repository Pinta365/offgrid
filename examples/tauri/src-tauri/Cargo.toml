[package]
name = "offgrid-tauri-chat"
description = "Tauri desktop chat app embedding offgrid"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone workspace: this example depends on offgrid the way an app outside this repo would.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
offgrid = { path = "../../../crates/offgrid" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
