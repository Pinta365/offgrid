[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# let-chains (`if ... && let ...`) need 1.88
rust-version = "1.88"

[workspace.dependencies]
offgrid-sys = { path = "crates/offgrid-sys", default-features = false }
offgrid = { path = "crates/offgrid", default-features = false }

[profile.release]
lto = "thin"
