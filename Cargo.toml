[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/Pinta365/offgrid"
# let-chains (`if ... && let ...`) need 1.88
rust-version = "1.88"

[workspace.dependencies]
offgrid-sys = { path = "crates/offgrid-sys", version = "0.4.4", default-features = false }
offgrid = { path = "crates/offgrid", version = "0.4.4", default-features = false }

[profile.release]
lto = "thin"
