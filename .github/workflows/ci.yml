name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LLVM_MINGW_RELEASE: "20261006"
  ZIG_VERSION: "0.16.0"
  # Tiny model for CPU inference smoke tests.
  SMOKE_MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: rustfmt
        run: |
          cargo fmt --all -- --check
          (cd examples/tauri/src-tauri && cargo fmt -- --check)
      - name: deno fmt, lint, check
        run: |
          (cd bindings/deno && deno fmt --check && deno lint && deno check mod.ts mod_test.ts)
          deno fmt --check --line-width 120 examples/deno scripts/openai-compat.ts
          deno lint examples/deno scripts/openai-compat.ts
          deno check examples/deno/*.ts scripts/openai-compat.ts
      - name: shell syntax
        run: for s in scripts/*.sh; do bash -n "$s"; done

  linux:
    runs-on: ubuntu-24.04
    env:
      # cmake picks these up, so llama.cpp's C/C++ objects are cached between runs.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers ccache
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 2G
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (model tests skip without models)
        run: cargo test --workspace
      - name: Deno binding tests
        run: |
          cargo build -p offgrid-ffi
          (cd bindings/deno && deno task test)
      - name: C examples
        run: make -C examples/c LIBDIR=../../target/debug chat embed cancel
      - name: Smoke model
        uses: actions/cache@v4
        with:
          path: smoke-model.gguf
          key: smoke-model-stories15M-q4_0
      - name: CPU inference smoke test (no GPU on the runner)
        run: |
          [ -f smoke-model.gguf ] || curl -fsSL -o smoke-model.gguf "$SMOKE_MODEL_URL"
          LD_LIBRARY_PATH=target/debug examples/c/chat smoke-model.gguf "Once upon a time" | tee chat.txt
          grep -q '^assistant:' chat.txt

  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Package (zig, glibc 2.28)
        run: OFFGRID_TOOLCHAIN=zig scripts/package-linux.sh
      - name: Smoke model
        uses: actions/cache@v4
        with:
          path: smoke-model.gguf
          key: smoke-model-stories15M-q4_0
      - name: Portability checks
        run: |
          [ -f smoke-model.gguf ] || curl -fsSL -o smoke-model.gguf "$SMOKE_MODEL_URL"
          OFFGRID_CHECK_DENO=0 scripts/check-portable.sh dist/offgrid-*-linux-x86_64 smoke-model.gguf
      - uses: actions/upload-artifact@v4
        with:
          name: offgrid-linux-x86_64
          path: dist/offgrid-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-package:
    runs-on: ubuntu-24.04
    env:
      # cmake picks these up, so llama.cpp's C/C++ objects are cached between runs.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers ccache zip
      - name: llvm-mingw
        run: |
          name="llvm-mingw-${LLVM_MINGW_RELEASE}-ucrt-ubuntu-22.04-x86_64"
          mkdir -p ~/.local/share
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_RELEASE}/${name}.tar.xz" \
            | tar -xJ -C ~/.local/share
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnullvm
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-cross
          max-size: 2G
      - name: Package (cross-compiled with llvm-mingw)
        run: scripts/package-windows.sh
      - name: Static checks
        run: scripts/check-windows.sh dist/offgrid-*-windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: offgrid-windows-x86_64
          path: dist/offgrid-*-windows-x86_64.zip
          if-no-files-found: error
