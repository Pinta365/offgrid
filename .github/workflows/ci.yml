name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tiny model for CPU inference smoke tests.
  SMOKE_MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: rustfmt
        run: |
          cargo fmt --all -- --check
          (cd examples/tauri/src-tauri && cargo fmt -- --check)
      - name: deno fmt, lint, check
        run: |
          (cd bindings/deno && deno fmt --check && deno lint && deno check mod.ts mod_test.ts native.ts native_test.ts && deno publish --dry-run --allow-dirty)
          deno fmt --check --line-width 120 examples/deno scripts/openai-compat.ts
          deno lint examples/deno scripts/openai-compat.ts
          deno check examples/deno/*.ts scripts/openai-compat.ts
      - name: shell syntax
        run: for s in scripts/*.sh; do bash -n "$s"; done

  linux:
    runs-on: ubuntu-24.04
    env:
      # cmake picks these up, so llama.cpp's C/C++ objects are cached between runs.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers ccache
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 2G
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Committed bindings match llama.cpp
        run: scripts/gen-bindings.sh --check linux
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p offgrid -p offgrid-sys --features offgrid/image --all-targets -- -D warnings
      - name: Tests (model tests skip without models)
        run: cargo test --workspace
      - name: Deno binding tests
        run: |
          cargo build -p offgrid-ffi
          (cd bindings/deno && deno task test)
      - name: Crates package (offgrid-sys must stay under crates.io's 10 MB limit)
        run: |
          cargo package -p offgrid-sys -p offgrid -p offgrid-server --no-verify
          size=$(stat -c %s target/package/offgrid-sys-*.crate)
          echo "offgrid-sys crate: $((size / 1048576)) MB"
          [ "$size" -lt $((8 * 1048576)) ]
      - name: C examples
        run: make -C examples/c LIBDIR=../../target/debug chat embed cancel
      - name: Smoke model
        uses: actions/cache@v4
        with:
          path: smoke-model.gguf
          key: smoke-model-stories15M-q4_0
      - name: CPU inference smoke test (no GPU on the runner)
        run: |
          [ -f smoke-model.gguf ] || curl -fsSL -o smoke-model.gguf "$SMOKE_MODEL_URL"
          LD_LIBRARY_PATH=target/debug examples/c/chat smoke-model.gguf "Once upon a time" | tee chat.txt
          grep -q '^assistant:' chat.txt

  windows:
    # Cross-builds the Windows package and runs its static checks (the only Windows compile on PRs).
    uses: ./.github/workflows/package.yml
    with:
      linux: false
      upload: false
