name: Publish

# Runs when a release is published (after reviewing the draft from release.yml): publishes the
# crates to crates.io and the Deno binding to JSR. JSR goes after the release because the binding
# downloads the release's packages and embeds their checksums.
#
# Setup: a CARGO_REGISTRY_TOKEN secret (crates.io API token with publish scope), and the JSR
# package @pinta365/offgrid linked to this repository (jsr.io > package settings > GitHub).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  crates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "offgrid") | .version')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG != v$version"; exit 1; }
      - name: Publish offgrid-sys, offgrid, offgrid-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p offgrid-sys -p offgrid -p offgrid-server

  jsr:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # JSR authenticates GitHub Actions through OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Release checksums into the binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          [ "$(jq -r .version bindings/deno/deno.json)" = "$version" ] \
            || { echo "::error::bindings/deno/deno.json version != $version"; exit 1; }
          gh release download "$TAG" -p 'offgrid-*-x86_64.tar.gz' -D assets
          scripts/deno-release.sh "$version" assets
          cat bindings/deno/release.ts
      - name: Publish to JSR
        working-directory: bindings/deno
        run: deno publish --allow-dirty
