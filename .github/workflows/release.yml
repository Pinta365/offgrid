name: Release

# Push a tag matching the crate version (e.g. v0.1.0) to build both packages and create a draft
# GitHub release with them attached. Publish the draft by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "offgrid-ffi") | .version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "offgrid ${GITHUB_REF_NAME#v}" dist/*
