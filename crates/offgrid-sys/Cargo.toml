[package]
name = "offgrid-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "llama"
description = "Low-level FFI bindings to llama.cpp (Vulkan/CPU), built from source."
build = "build.rs"

[features]
default = ["vulkan"]
vulkan = []
cuda = []
# Shared libs + runtime-loaded backends + all CPU variants (for distributable builds).
dynamic-backends = []

[build-dependencies]
cmake = "0.1.58"
bindgen = "0.73"
