language = "C"
include_guard = "OFFGRID_H"
cpp_compat = true
usize_is_size_t = true
style = "type"
header = """/*
 * offgrid — embeddable offline AI core. C ABI.
 * Generated by cbindgen from crates/offgrid-ffi; do not edit.
 *
 * Conventions:
 *  - Handles are opaque; free each with its *_free function (NULL is ignored).
 *  - Params/requests/results are UTF-8 JSON. NULL or "" JSON means defaults.
 *  - Returned char* strings are owned by the caller: free with offgrid_string_free().
 *  - Fallible functions take a trailing `char **error_out` (nullable). On failure they return
 *    NULL / negative and store a message there (free with offgrid_string_free); NULL on success.
 *  - A handle must not be used from two threads at once, except offgrid_chat_cancel().
 */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export.rename]
"OffgridModel" = "offgrid_model"
"OffgridChat" = "offgrid_chat"
"OffgridEmbedder" = "offgrid_embedder"
"OffgridTokenCallback" = "offgrid_token_callback"
"OffgridLogCallback" = "offgrid_log_callback"
"OffgridEventCallback" = "offgrid_event_callback"

[fn]
args = "horizontal"
