[package]
name = "aicore"
description = "Embeddable offline AI core: safe Rust API over llama.cpp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["vulkan"]
vulkan = ["aicore-sys/vulkan"]
cuda = ["aicore-sys/cuda"]

[dependencies]
aicore-sys = { workspace = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
