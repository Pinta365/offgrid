[package]
name = "aicore-ffi"
description = "C ABI for aicore: JSON in/out, streaming callbacks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Produces libaicore.so / aicore.dll / libaicore.a
name = "aicore"
crate-type = ["cdylib", "staticlib"]

[features]
default = ["vulkan"]
vulkan = ["aicore/vulkan"]
cuda = ["aicore/cuda"]
dynamic-backends = ["aicore/dynamic-backends"]

[dependencies]
aicore = { workspace = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"
